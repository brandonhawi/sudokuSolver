<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Sudoku</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='board.css') }}">
</head>

<body>
    <main>
        <h1>Sudoku</h1>

        <table id="board"></table>

        <p id="status">Loading&hellip;</p>

        <div class="controls">
            <button data-difficulty="easy">New easy game</button>
            <button data-difficulty="medium">New medium game</button>
            <button data-difficulty="hard">New hard game</button>
            <button id="undo">Undo</button>
        </div>

        <p class="hint">
            Click a cell and type 1-9 to place a number, or backspace to clear it.
            Moves made through the MCP server show up here automatically.
        </p>
    </main>

    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>

</html>
