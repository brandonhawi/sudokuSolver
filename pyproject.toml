[project]
name = "sudoku-game"
version = "0.1.0"
description = "A playable Sudoku game whose controls are exposed to language models over MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kagglehub>=1.0.2",
    "mlflow>=3.15.1",
    "numpy>=2.2.6",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
