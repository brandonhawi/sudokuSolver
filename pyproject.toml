[project]
name = "sudoku-game"
version = "0.1.0"
description = "A playable Sudoku game whose controls are exposed to language models over MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kagglehub>=1.0.2",
    "mlflow>=3.15.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "uvicorn>=0.52.3",
]

[tool.ruff]
line-length = 100

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
