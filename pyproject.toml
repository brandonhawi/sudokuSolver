[project]
name = "sudoku-game"
version = "0.1.0"
description = "A playable Sudoku game whose controls are exposed to language models over MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "httpx",
    "mcp",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "autopep8",
    "pylint",
    "rope",
]
