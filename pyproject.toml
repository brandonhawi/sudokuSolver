[project]
name = "sudoku-game"
version = "0.1.0"
description = "A playable Sudoku game whose controls are exposed to language models over MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "httpx",
    "mcp>=1.24.0,<2.0.0",
    "python-dotenv",
]

[dependency-groups]
agent = [
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "mlflow>=3.15.1",
]
dev = [
    "autopep8",
    "pylint",
    "rope",
]
